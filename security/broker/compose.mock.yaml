# Restricted text interface; defaults to mock only. No existing user state mounted.
name: learnharness-broker-review
x-restricted: &restricted
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  pids_limit: 64
  mem_limit: 256m
  pull_policy: never
services:
  init:
    <<: *restricted
    image: ${BROKER_IMAGE:?Pinned broker image required}
    network_mode: none
    command: [node, -e, "const fs=require('fs');if(!fs.existsSync('/view-secret/token'))fs.writeFileSync('/view-secret/token',require('crypto').randomBytes(32).toString('hex'),{mode:384});"]
    volumes: [app-ipc:/app-ipc, view-secret:/view-secret, app-state:/state]
  app:
    <<: *restricted
    image: ${APP_IMAGE:?Pinned app image required}
    command: [node, --import, tsx, security/broker/app-ipc.mjs]
    healthcheck:
      test: [CMD, node, -e, "process.exit(require('fs').existsSync('/app-ipc/app.sock')?0:1)"]
      interval: 1s
      timeout: 2s
      retries: 30
    network_mode: none
    mem_limit: 2g
    pids_limit: 256
    depends_on:
      init: {condition: service_completed_successfully}
      broker: {condition: service_healthy}
    volumes: [socket:/broker:ro, app-ipc:/app-ipc, app-state:/state, course:/course:ro]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000"]
    environment:
      LH_BROKER_MODE: "1"
      LH_DATA_DIR: /state/data
      LH_AUTH_FILE: /state/auth.json
      LH_SOURCE_ROOT: /course
      LH_DISABLE_SUBSCRIPTION_AUTH: "1"
      LH_IGNORE_ENV_KEYS: "1"
      LH_DISABLE_RESEARCH: "1"
      NEXT_TELEMETRY_DISABLED: "1"
  broker:
    <<: *restricted
    image: ${BROKER_IMAGE:?Pinned broker image required}
    networks: [mock-only]
    volumes: [socket:/broker, control:/control, ledger:/state]
    environment: {LH_BROKER_UPSTREAM: mock}
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');process.exit(fs.existsSync('/broker/request.sock')&&fs.existsSync('/control/admin.sock')?0:1)"]
      interval: 1s
      timeout: 2s
      retries: 30
  mock:
    <<: *restricted
    image: ${BROKER_IMAGE:?Pinned broker image required}
    command: [node, mock.mjs]
    networks: [mock-only]
  view-net:
    <<: *restricted
    image: ${VIEW_NET_IMAGE:?Pinned inbound-only network image required}
    user: "0:0"
    cap_add: [NET_ADMIN, SETPCAP]
    networks: [view-only]
    ports: [127.0.0.1:3188:8080]
    tmpfs: ["/run:rw,noexec,nosuid,nodev,size=1m"]
  view:
    <<: *restricted
    image: ${BROKER_IMAGE:?Pinned broker image required}
    command: [node, view.mjs]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8080/',{headers:{host:process.env.LH_VIEW_HOST}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      init: {condition: service_completed_successfully}
      view-net: {condition: service_healthy}
      app: {condition: service_healthy}
      broker: {condition: service_healthy}
    network_mode: service:view-net
    volumes: [control:/control:ro, app-ipc:/app-ipc:ro, view-secret:/view-secret:ro]
    environment: {LH_VIEW_HOST: "127.0.0.1:3188"}
volumes:
  socket:
  control:
  ledger:
  app-ipc:
  app-state:
  view-secret:
  course:
networks:
  mock-only:
    internal: true
    driver_opts: {com.docker.network.bridge.gateway_mode_ipv4: isolated}
  # The dedicated namespace firewall denies outbound traffic before the view starts.
  view-only: {}
