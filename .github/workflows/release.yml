name: Desktop release

on:
  # Manual runs are artifact-only, unsigned, and NEVER create a release.
  # Use this for the first Windows/Linux dress rehearsal without secrets.
  workflow_dispatch:

permissions:
  contents: read

# Serialize separate runs for the same ref; never cancel an upload in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              console.error("Release tag must equal v" + version);
              process.exit(1);
            }
          '
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  package:
    name: Package (${{ matrix.platform }})
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            builder_args: --mac --arm64
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux --x64
    runs-on: ${{ matrix.os }}
    # Apple's notarization queue has taken ~2 hours for this team.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      # The mac icon is the Icon Composer document (build/icon.icon);
      # compiling it needs both macOS 26+ and actool ≥ 26 (Xcode 26+).
      # Xcode 26's asset compiler crashes on macOS 15's older frameworks.
      # Select the latest stable Xcode; no-op for Windows/Linux.
      - name: Select Xcode 26+ for actool (mac icon compile)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Unsigned macOS rehearsal (no publish, no notarization)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder_args }} --publish never -c.mac.notarize=false
      - name: Windows/Linux rehearsal (no publish)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/LearnHarness.app/Contents"
              payload="$app/Resources/server/standalone"
              runtime="$app/MacOS/LearnHarness"
              ;;
            Windows)
              payload="dist/win-unpacked/resources/server/standalone"
              runtime="dist/win-unpacked/LearnHarness.exe"
              ;;
            Linux)
              payload="dist/linux-unpacked/resources/server/standalone"
              runtime="dist/linux-unpacked/learnharness"
              ;;
          esac
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Check packaged demo dependencies without executing generated content
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/LearnHarness.app/Contents"
              node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/LearnHarness"
              ;;
            Windows)
              node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/LearnHarness.exe
              ;;
            Linux)
              xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/learnharness
              ;;
          esac
      - name: Save installers and update metadata
        uses: actions/upload-artifact@v7
        with:
          name: learnharness-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
